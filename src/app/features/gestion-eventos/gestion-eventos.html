<div class="min-h-screen bg-[#f1f5f9] font-sans antialiased selection:bg-emerald-100 p-4 md:p-8 lg:p-12">
    
    <header class="max-w-[1600px] mx-auto mb-16 flex flex-col lg:row md:flex-row justify-between items-start md:items-end gap-8">
        <div class="relative">
            <div class="flex items-center gap-4 mb-4">
                <div class="flex gap-1">
                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-bounce"></div>
                    <div class="w-1.5 h-1.5 bg-emerald-500/40 rounded-full"></div>
                    <div class="w-1.5 h-1.5 bg-emerald-500/20 rounded-full"></div>
                </div>
                <span class="text-emerald-600 font-black uppercase tracking-[0.4em] text-[10px]">Pol Events Interface v3.0</span>
            </div>
            <h1 class="text-6xl md:text-7xl font-black text-slate-950 tracking-[ -0.05em] uppercase leading-none">
                Master <span class="relative inline-block">
                    <span class="relative z-10 text-emerald-500 italic">Control</span>
                    <span class="absolute -bottom-2 left-0 w-full h-4 bg-slate-900 -z-10 rotate-1"></span>
                </span>
            </h1>
        </div>

        <div class="group relative bg-slate-950 p-6 rounded-[2.5rem] shadow-2xl flex items-center gap-8 border border-white/10 transition-all hover:scale-105">
            <div class="absolute inset-0 bg-emerald-500/5 rounded-[2.5rem] blur-xl group-hover:bg-emerald-500/10 transition-colors"></div>
            <div class="relative z-10">
                <p class="text-[9px] font-bold text-emerald-500 uppercase tracking-widest mb-1">Unidades en Red</p>
                <p class="text-4xl font-black text-white tabular-nums tracking-tighter">{{listaEventos().length}}</p>
            </div>
            <div class="relative z-10 w-14 h-14 bg-emerald-500 rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-emerald-500/20">
                📂
            </div>
        </div>
    </header>

    <div class="max-w-[1600px] mx-auto grid grid-cols-1 xl:grid-cols-12 gap-12 items-start">
        
        <aside class="xl:col-span-4 sticky top-12">
            <div class="bg-white p-1 rounded-[3.5rem] shadow-[0_30px_60px_-15px_rgba(0,0,0,0.1)] border border-slate-100 overflow-hidden">
                <div class="bg-slate-50 p-10 rounded-[3.2rem]">
                    <app-agregar-editar (eventoGuardado)="obtenerEventos()"></app-agregar-editar>
                </div>
            </div>
        </aside>

        <main class="xl:col-span-8 w-full space-y-10">
            <div class="flex items-center justify-between border-b border-slate-200 pb-6">
                <h3 class="text-slate-400 font-black uppercase tracking-[0.3em] text-[11px] flex items-center gap-3">
                    <span class="w-8 h-px bg-slate-300"></span>
                    Live Experience Feed
                </h3>
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-slate-200"></div>
                    <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                </div>
            </div>

            <div class="relative">
                <app-listado-eventos 
                    [eventos]="listaEventos()" 
                    (eventoEliminado)="obtenerEventos()">
                </app-listado-eventos>
            </div>

            <div class="flex flex-col md:flex-row items-center justify-between gap-4 pt-10 border-t border-slate-200">
                <div class="flex items-center gap-4">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Node: Quito_Srv_01</span>
                    <span class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">● Secure Connection</span>
                </div>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                    &copy; 2026 POL PROJECTS &bull; ALL SYSTEMS OPERATIONAL
                </p>
            </div>
        </main>
    </div>
</div>
